name: Deploy grammar service
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - infra/languagetool/**
      - .github/workflows/deploy-grammar.yml
permissions:
  contents: read
concurrency:
  group: sigmawrite-grammar-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the grammar container to Hetzner
        env:
          DEPLOY_KEY: ${{ secrets.SIGMAWRITE_GRAMMAR_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SIGMAWRITE_GRAMMAR_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.SIGMAWRITE_GRAMMAR_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/grammar_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/grammar_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/grammar_key' EXIT
          printf '%s\n' "$GITHUB_SHA" | ssh -i ~/.ssh/grammar_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "sigmawrite-deploy@$DEPLOY_HOST"
      - name: Verify the hosted French checker and authentication
        env:
          LANGUAGETOOL_URL: https://grammar.trouvetaplume.com
          LANGUAGETOOL_API_KEY: ${{ secrets.SIGMAWRITE_GRAMMAR_API_KEY }}
        run: node infra/languagetool/smoke.mjs

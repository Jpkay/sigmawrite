name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
      ANALYTICS_ID_SALT: ${{ secrets.ANALYTICS_ID_SALT }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_CONTROLLER_NAME: ${{ secrets.NEXT_PUBLIC_CONTROLLER_NAME }}
      NEXT_PUBLIC_PRIVACY_CONTACT: ${{ secrets.NEXT_PUBLIC_PRIVACY_CONTACT }}
      NEXT_PUBLIC_DATA_REGION: ${{ secrets.NEXT_PUBLIC_DATA_REGION }}
      NEXT_PUBLIC_AI_PROCESSORS: ${{ secrets.NEXT_PUBLIC_AI_PROCESSORS }}
      LANGUAGETOOL_URL: ${{ secrets.LANGUAGETOOL_URL }}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: "true"
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v2
        with: { version: 2.109.1, github-token: "${{ github.token }}" }
      - run: npm ci
      - name: Run release and environment preflight
        run: npm run ci && npm run launch:verify-env
      - name: Build immutable Vercel artifact before database changes
        run: |
          npx vercel@50.9.0 pull --yes --environment=${{ github.event.inputs.environment == 'production' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
          npx vercel@50.9.0 build ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Apply numbered expand-compatible migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Seed approved competency item banks
        run: npm run seed:item-banks
      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url=$(npx vercel@50.9.0 deploy --prebuilt ${{ github.event.inputs.environment == 'production' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post-deploy public smoke
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /login /privacy /reset-password; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors "$DEPLOY_URL$path" >/dev/null
          done

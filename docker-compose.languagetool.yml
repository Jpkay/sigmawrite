services:
  languagetool:
    build: ./infra/languagetool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8080"
    environment:
      LANGUAGETOOL_API_KEY: ${LANGUAGETOOL_API_KEY:?Set a 64-character hexadecimal service key}
      Java_Xms: 256m
      Java_Xmx: 1024m
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

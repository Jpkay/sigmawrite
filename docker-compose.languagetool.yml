services:
  languagetool:
    image: erikvl87/languagetool:6.6
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      Java_Xms: 256m
      Java_Xmx: 1024m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8010/v2/languages"]
      interval: 30s
      timeout: 5s
      retries: 5

app = "sigmawrite-grammar"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  Java_Xms = "256m"
  Java_Xmx = "1024m"
  langtool_maxCheckThreads = "2"
  langtool_maxCheckTimeMillis = "8000"
  langtool_maxTextLength = "30000"
  langtool_pipelineCaching = "true"
  langtool_pipelinePrewarming = "true"
  langtool_preferredLanguages = "fr"
  langtool_pipelineExpireTimeInSeconds = "3600"
  langtool_maxPipelinePoolSize = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
